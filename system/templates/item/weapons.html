<div class="weapons-content">
    <h4 class="section-header">{{ localize 'L5r5e.Weapons' }}</h4>
    <ul class="item-list">
        {{#each actor.items as |item id|}}

                {{> 'systems/l5r5e/templates/item/weapon-entry.html' item=item id=id }}
            {{/if}}
        {{/each}}
    </ul>
</div>
