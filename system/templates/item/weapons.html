<fieldset class="weapons-content">
    <legend class="section-header">{{ localize 'l5r5e.weapons' }}</legend>
    <ul class="item-list">
        {{#each actor.items as |item id|}}
            {{#if item.isWeapon }}
                {{> 'systems/l5r5e/templates/item/weapon-entry.html' item=item id=id }}
            {{/if}}
        {{/each}}
    </ul>
</fieldset>
