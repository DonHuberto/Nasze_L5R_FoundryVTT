<fieldset class="items-content">
    <legend>{{ localize 'l5r5e.equipment' }}</legend>
    <ul class="item-list">
        {{#each actor.items as |item id|}}
            {{#if item.isEquipment }}
                {{> 'systems/l5r5e/templates/item/item-entry.html' item=item id=id }}
            {{/if}}
        {{/each}}
    </ul>
</fieldset>
