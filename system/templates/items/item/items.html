<fieldset class="items-content">
    <legend>{{ localize 'l5r5e.equipment' }}</legend>
    <ul class="item-list">
        {{#each actor.items as |item id|}}
            {{#ifCond item.type '==' 'item'}}
                {{> 'systems/l5r5e/templates/items/item/item-entry.html' item=item id=id editable=../editable }}
            {{/ifCond}}
        {{/each}}
    </ul>
</fieldset>
